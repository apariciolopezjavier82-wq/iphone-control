[workspace]
resolver = "3"
members = [
    "crates/ictl-device",
    "crates/ictl-wda",
    "crates/ictl-protocol",
    "crates/ictl-sign",
    "crates/ictl-unlock",
    "crates/ictl-daemon",
    "crates/ictl-mcp",
    "apps/iphone-control",
]
# vendor/ 下是 Impactor 的组件（MPL-2.0 / MIT），作为路径依赖使用，但不算本 workspace 成员：
# 不对它们跑 clippy/test，也不把它们的 lint 当成本项目的问题。
exclude = ["vendor"]

[workspace.package]
version = "0.1.4"
edition = "2024"
# rmcp 3.8 要求 1.88；Impactor/idevice 用 edition 2024
rust-version = "1.88"
license = "MIT"
publish = false
repository = "https://github.com/Derrors/iphone-control"
homepage = "https://github.com/Derrors/iphone-control"

# 全部锁精确版本：idevice 0.2.0 之前每个小版本都可能有破坏性变更（见 docs/decisions.md D9）
[workspace.dependencies]
idevice = { version = "=0.1.68", default-features = false, features = [
    "ring",
    "usbmuxd",
    "pair",
    "amfi",
    "afc",
    "core_device_proxy",
    "tunnel_tcp_stack",
    "rsd",
    "xpc",
    "core_device",
    "display_stream",
    "cryptexd",
    "tss",
    "installation_proxy",
    "misagent",
    "xctest",
] }
rmcp = { version = "=3.8.0", features = ["server", "transport-io"] }
tokio = { version = "=1.54.1", features = ["full"] }
# rustls-no-provider：不编进 aws-lc-rs（C 代码，编译慢、体积大）；idevice/plume_core 用 ring，入口处显式装 ring 为默认 provider
reqwest = { version = "=0.13.5", default-features = false, features = ["form", "rustls-no-provider"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring"] }
quick-xml = "=0.42.0"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
clap = { version = "=4.6.7", features = ["derive", "env"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
base64 = "=0.23.1"
anyhow = "=1.0.104"
plist = "=1.10.3"
uuid = { version = "=1.26.1", features = ["v4"] }
zip = { version = "=9.4.1", default-features = false, features = ["deflate"] }
regex = "=1.13.1"
libc = "=0.2.191"
sha2 = "=0.10.9"
ring = "=0.17.14"
zeroize = "=1.9.1"

# vendored Impactor 组件（见 THIRD_PARTY.md）
plume_core = { path = "vendor/plume_core" }
plume_store = { path = "vendor/plume_store" }

ictl-device = { path = "crates/ictl-device" }
ictl-wda = { path = "crates/ictl-wda" }
ictl-protocol = { path = "crates/ictl-protocol" }
ictl-sign = { path = "crates/ictl-sign" }
ictl-unlock = { path = "crates/ictl-unlock" }
ictl-daemon = { path = "crates/ictl-daemon" }
ictl-mcp = { path = "crates/ictl-mcp" }

# Impactor 给 apple-codesign 0.29.0 打的权限补丁（0o755）。作为 git 依赖引用 Impactor 时
# 它自己的 [patch] 不生效，所以这里 vendor 打过补丁的副本（docs/decisions.md D6）。
[patch.crates-io]
apple-codesign = { path = "vendor/apple-codesign" }
# idevice 0.1.68 的 cryptexd install 会挂住(persistence 字段错、隧道 MSS),修复在上游 master 但还没发版
idevice = { git = "https://github.com/jkcoxson/idevice", rev = "89702099f4d7552f704f93b4526756abda319ceb" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
